# 115SavePro 部署文件
#
# 直接启动（镜像已发布在 GHCR，匿名可拉取，无需登录）：
#   docker compose up -d
#
# 更新到最新版：
#   docker compose pull && docker compose up -d
#
# 想改用 Docker Hub 镜像的话，把 image 换成：
#   image: 你的DockerHub用户名/115savepro:latest
#
# 想本地构建（改代码后自己编译）：
#   打开下面的 build: . 并注释掉 image 行，然后 docker compose up -d --build

services:
  115savepro:
    image: ghcr.io/xiaoming677/115savepro:latest
    # build: .
    container_name: 115savepro
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # config 存账号 Cookie / 任务 / 历史 / QMS 配置，必须持久化
      - ./config:/app/config
      - ./log:/app/log
    environment:
      - TZ=Asia/Shanghai
      - PORT=5000
    # 如果 QMediaSync 也在同一台 NAS 的 Docker 里，用 host 网络访问更省事：
    # network_mode: host
