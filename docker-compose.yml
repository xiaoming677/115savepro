# 115SavePro 部署文件
#
# 用法一（推荐，直接拉现成镜像，更新最省事）：
#   把下面的 image 改成你的镜像地址，然后：
#   docker compose pull && docker compose up -d
#
# 用法二（本地构建）：
#   把 build: . 打开、image 行注释掉，然后 docker compose up -d --build

services:
  115savepro:
    # ↓↓↓ 改成你自己的 Docker Hub 镜像地址，例如 xxxx/115savepro:latest ↓↓↓
    image: yourname/115savepro:latest
    # build: .
    container_name: 115savepro
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # config 存账号 Cookie / 任务 / 历史 / QMS 配置，必须持久化
      - ./config:/app/config
      - ./log:/app/log
    environment:
      - TZ=Asia/Shanghai
      - PORT=5000
    # 如果 QMediaSync 也在同一台 NAS 的 Docker 里，用 host 网络访问更省事：
    # network_mode: host
