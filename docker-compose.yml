# 115SavePro 部署文件
#
# 直接启动（镜像已发布到两个仓库，均可匿名拉取）：
#   docker compose up -d
#
# 更新到最新版：
#   docker compose pull && docker compose up -d --force-recreate
#
# ⚠️ 国内网络请优先用 Docker Hub 镜像（ghcr.io 经常连不上）：
#   把下面的 image 换成
#     image: xiaoming677/115savepro:latest
#   原因：ghcr.io 在国内常见超时/静默返回旧摘要，表现为「更新了但版本没变」。
#   版本号可用 latest，也可锁定具体版本如 1.2.0。
#
# 想本地构建（改代码后自己编译）：
#   打开下面的 build: . 并注释掉 image 行，然后 docker compose up -d --build

services:
  # 服务名避免以数字开头：部分 compose 实现/网页编辑器会把纯数字开头的键误解析
  save115:
    image: ghcr.io/xiaoming677/115savepro:latest
    # build: .
    container_name: 115savepro
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # config 存账号 Cookie / 任务 / 历史 / QMS 配置，必须持久化
      - ./config:/app/config
      - ./log:/app/log
      # 【可选】把下面这行取消注释并重新 up -d，就能在面板「系统设置 → 版本更新」
      # 里一键更新，不用再去飞牛 Docker 界面手动拉镜像 + 重构。
      #   ⚠️ 挂载 docker.sock 相当于把宿主机 Docker 的控制权交给本容器（等价 root），
      #      请自行评估。不需要一键更新就不要开 —— 检查更新与手动更新命令都不受影响。
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Asia/Shanghai
      - PORT=5000
    # 如果 QMediaSync 也在同一台 NAS 的 Docker 里，用 host 网络访问更省事：
    # network_mode: host
