name: Build and Push Docker Image

# 触发条件：
#   1. 推送到 main        -> 构建并推送 :latest
#   2. 推送 v 开头的 tag  -> 构建并推送 :v1.2.3 和 :1.2.3
#   3. 手动触发
#
# 推送目标：
#   - GHCR（ghcr.io/<owner>/<repo>）：始终推送，用仓库自带的 GITHUB_TOKEN，零配置
#   - Docker Hub：仅当仓库已配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 两个 Secret 时才推送
#     没配置不会报错，会自动跳过并只推 GHCR。
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      push:
        description: '是否推送镜像（false 则只构建验证，不推任何仓库）'
        type: boolean
        default: true

env:
  IMAGE_NAME: 115savepro

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # 推送 GHCR 需要

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ---------- 判断 Docker Hub 是否已配置 ----------
      - name: 检查 Docker Hub 配置
        id: dh
        env:
          # Docker Hub 用户名不是机密，优先从 Repository variable 读（方便修改），
          # 也兼容放在 Secret 里。只有 Token 必须放 Secret。
          DH_USER: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "user=$DH_USER" >> "$GITHUB_OUTPUT"
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "检测到 Docker Hub 配置（用户名：$DH_USER），将同时推送到 Docker Hub 和 GHCR"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            [ -z "$DH_USER" ] && echo "::warning::缺少 Docker Hub 用户名，请配置 Repository variable 或 Secret「DOCKERHUB_USERNAME」"
            [ -z "$DH_TOKEN" ] && echo "::warning::缺少 Docker Hub Token，请配置 Repository secret「DOCKERHUB_TOKEN」"
            echo "::notice title=Docker Hub 未配置::本次只推送到 GHCR（ghcr.io）。配置方法见仓库 Settings → Secrets and variables → Actions，详见 README「发布与更新」章节。"
          fi

      # ---------- 组装要推送的镜像地址 ----------
      - name: 组装镜像列表
        id: imgs
        env:
          DH_USER: ${{ steps.dh.outputs.user }}
          # 关键：必须跟「登录 Docker Hub」用同一个判断条件。
          # 只判断用户名会导致"有用户名但没 Token"时把 Docker Hub 镜像写进列表，
          # 但登录被跳过 -> push 报 401 access token has insufficient scopes。
          DH_ENABLED: ${{ steps.dh.outputs.enabled }}
        run: |
          {
            echo "list<<EOF"
            if [ "$DH_ENABLED" = "true" ] && [ -n "$DH_USER" ]; then
              echo "$(echo "$DH_USER" | tr '[:upper:]' '[:lower:]')/${IMAGE_NAME}"
            fi
            echo "$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]' | sed 's|^|ghcr.io/|')"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        if: steps.dh.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ steps.dh.outputs.user }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.imgs.outputs.list }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: 记录构建时间
        id: bt
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          # 飞牛 NAS / 常见 x86 服务器基本都是 amd64；需要 ARM 就改成 linux/amd64,linux/arm64
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ steps.bt.outputs.date }}
            VCS_REF=${{ github.sha }}

      - name: 输出摘要
        run: |
          {
            echo "### 构建完成 :whale:"
            echo ""
            echo "**推送目标：** $([[ '${{ steps.dh.outputs.enabled }}' == 'true' ]] && echo 'Docker Hub + GHCR' || echo '仅 GHCR')"
            echo ""
            echo "**镜像标签：**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "**更新方法：**"
            echo '```bash'
            echo "docker compose pull && docker compose up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
