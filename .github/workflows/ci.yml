name: CI

# 每次推送/PR 做一次轻量自检：Python 语法 + 前端 JS 语法
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与 Dockerfile 保持一致（p115client 要求 >= 3.12）
          python-version: '3.12'

      - name: Python 语法检查
        run: |
          python -m compileall -q . -x '\.venv' && echo "Python 语法 OK"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 前端 JS 语法检查
        run: |
          python - <<'PY'
          import re, pathlib
          html = pathlib.Path('templates/index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script>([\s\S]*?)</script>', html)
          assert blocks, 'index.html 里没找到 <script> 块'
          pathlib.Path('_check.js').write_text(blocks[-1], encoding='utf-8')
          print('提取 JS 成功，共', len(blocks[-1]), '字符')
          PY
          node --check _check.js && echo "JS 语法 OK"
          rm -f _check.js

      - name: 检查是否误提交敏感文件
        run: |
          fail=0
          for f in config/config.json config/history.db config/secret.key; do
            if [ -f "$f" ]; then echo "::error::$f 不应该被提交到仓库"; fail=1; fi
          done
          exit $fail
