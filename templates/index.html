<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>115SavePro · 115 网盘自动转存</title>
<style>
:root{
  --bg:#f4f6fa; --panel:#ffffff; --panel-2:#fafbfd; --line:#e4e8f0; --line-2:#eef1f7;
  --text:#1f2329; --text-2:#5c6675; --text-3:#8b95a5;
  --accent:#2f6fed; --accent-soft:#eaf1ff;
  --ok:#12a150; --ok-soft:#e6f7ee; --warn:#d97706; --warn-soft:#fef3e2;
  --err:#d92d20; --err-soft:#fdecea;
  --radius:10px; --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none !important}

/* ---------- 登录 ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eef3ff,#f7f9fc)}
.login-box{background:var(--panel);padding:36px 32px;border-radius:14px;box-shadow:0 8px 32px rgba(16,24,40,.10);width:340px}
.login-box h1{margin:0 0 4px;font-size:20px}
.login-box p.sub{margin:0 0 22px;color:var(--text-3);font-size:13px}

/* ---------- 布局 ---------- */
#app{display:flex;min-height:100vh}
.sidebar{width:206px;flex:0 0 206px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 18px 14px;font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.nav{padding:6px 10px;overflow-y:auto;flex:1}
.nav a{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;color:var(--text-2);
  margin-bottom:2px;cursor:pointer;font-size:13.5px}
.nav a:hover{background:var(--panel-2);color:var(--text)}
.nav a.active{background:var(--accent-soft);color:var(--accent);font-weight:500}
.nav a .ico{width:18px;text-align:center;font-size:15px}
.side-foot{padding:12px;border-top:1px solid var(--line-2);font-size:12px;color:var(--text-3)}
.main{flex:1;min-width:0;padding:22px 26px 60px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{margin:0;font-size:19px}
.page-head .desc{color:var(--text-3);font-size:12.5px;margin-top:2px}

/* ---------- 卡片 / 表格 ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.card-head{padding:13px 16px;border-bottom:1px solid var(--line-2);font-weight:600;display:flex;
  align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-body{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
.stat .k{color:var(--text-3);font-size:12.5px}
.stat .v{font-size:22px;font-weight:600;margin-top:5px;word-break:break-all}
.stat .v small{font-size:13px;font-weight:400;color:var(--text-3)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle;font-size:13.5px}
th{color:var(--text-2);font-weight:500;background:var(--panel-2);white-space:nowrap;font-size:12.5px}
tbody tr:hover{background:#fcfdff}
td.actions{white-space:nowrap}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.muted{color:var(--text-3)}
.trunc{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle}

/* ---------- 表单 ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px}
.field .hint{font-size:12px;color:var(--text-3);margin-top:5px}
input[type=text],input[type=password],input[type=number],select,textarea{
  width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,111,237,.10)}
textarea{min-height:96px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>.field{flex:1;min-width:180px}
.inline{display:flex;gap:8px;align-items:center}
.chk{display:flex;align-items:center;gap:7px;font-size:13.5px;cursor:pointer}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}

/* ---------- 按钮 ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:1px solid var(--line);
  background:#fff;color:var(--text);cursor:pointer;transition:.15s;white-space:nowrap;font-size:13.5px}
.btn:hover{border-color:#cfd8e6;background:var(--panel-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2a63d6;border-color:#2a63d6}
.btn.danger{color:var(--err);border-color:#f5c9c5}
.btn.danger:hover{background:var(--err-soft)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:6px}
.btn.link{border:none;background:none;color:var(--accent);padding:4px 6px}
.btn.link:hover{background:var(--accent-soft)}
.btn-group{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- 徽标 ---------- */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;background:var(--panel-2);
  border:1px solid var(--line);color:var(--text-2)}
.badge.ok{background:var(--ok-soft);border-color:#c3ead5;color:var(--ok)}
.badge.err{background:var(--err-soft);border-color:#f5c9c5;color:var(--err)}
.badge.warn{background:var(--warn-soft);border-color:#f6dfb8;color:var(--warn)}
.badge.blue{background:var(--accent-soft);border-color:#c7daff;color:var(--accent)}
.tw{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.tw.on{background:var(--ok)} .tw.off{background:#c9d1dd}

/* ---------- 弹窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.42);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--panel);border-radius:12px;width:100%;max-width:660px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(16,24,40,.22)}
.modal.wide{max-width:860px}
.modal-head{padding:15px 18px;border-bottom:1px solid var(--line-2);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:18px;overflow-y:auto;flex:1}
.modal-foot{padding:13px 18px;border-top:1px solid var(--line-2);display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap}
.x{cursor:pointer;color:var(--text-3);font-size:19px;line-height:1;border:none;background:none}

/* ---------- 目录选择器 ---------- */
.crumbs{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:13px;margin-bottom:10px;min-height:26px}
.crumbs span.c{cursor:pointer;color:var(--accent);padding:2px 6px;border-radius:5px}
.crumbs span.c:hover{background:var(--accent-soft)}
.crumbs span.sep{color:var(--text-3)}
.picklist{border:1px solid var(--line);border-radius:8px;max-height:330px;overflow-y:auto}
.pickrow{display:flex;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid var(--line-2);cursor:pointer}
.pickrow:hover{background:var(--panel-2)}
.pickrow:last-child{border-bottom:none}
.pickrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 日志 ---------- */
.logbox{background:#fbfcfe;border:1px solid var(--line);border-radius:8px;padding:12px;max-height:420px;
  overflow-y:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.75}
.logbox .l{white-space:pre-wrap;word-break:break-all}
.logbox .l.DEBUG{color:var(--text-3)}
.logbox .l.INFO{color:var(--text)}
.logbox .l.WARNING{color:var(--warn)}
.logbox .l.ERROR{color:var(--err)}

/* ---------- 其他 ---------- */
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#1f2329;color:#fff;
  padding:9px 18px;border-radius:8px;font-size:13.5px;z-index:300;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:80vw}
.toast.err{background:var(--err)} .toast.ok{background:var(--ok)}
.empty{text-align:center;color:var(--text-3);padding:40px 16px;font-size:13.5px}
code{background:var(--panel-2);border:1px solid var(--line-2);padding:1px 6px;border-radius:5px;font-size:12.5px}
.bar{height:6px;background:var(--line-2);border-radius:6px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px}
@media(max-width:820px){
  #app{flex-direction:column}
  .sidebar{width:100%;flex:none;height:auto;position:static;flex-direction:row;overflow-x:auto}
  .brand{display:none} .nav{display:flex;gap:4px;padding:8px}
  .nav a{white-space:nowrap;margin:0} .side-foot{display:none}
  .main{padding:16px}
}
</style>
</head>
<body>

<!-- ============ 登录 ============ -->
<div id="login">
  <div class="login-box">
    <h1>115SavePro</h1>
    <p class="sub">115 网盘自动转存 · 离线下载 · QMediaSync 联动</p>
    <div class="field"><label>用户名</label><input type="text" id="lg-user" value="admin" autocomplete="username"></div>
    <div class="field"><label>密码</label><input type="password" id="lg-pass" autocomplete="current-password" placeholder="默认 zxcvbnm"></div>
    <button class="btn primary" style="width:100%;justify-content:center" onclick="doLogin()">登录</button>
  </div>
</div>

<!-- ============ 主界面 ============ -->
<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span>115SavePro</div>
    <nav class="nav" id="nav">
      <a data-view="dashboard" class="active"><span class="ico">▦</span>仪表盘</a>
      <a data-view="users"><span class="ico">☺</span>账号管理</a>
      <a data-view="tasks"><span class="ico">⇄</span>转存任务</a>
      <a data-view="offline"><span class="ico">⤓</span>离线下载</a>
      <a data-view="files"><span class="ico">▤</span>文件管理</a>
      <a data-view="history"><span class="ico">☰</span>转存日志</a>
      <a data-view="qms"><span class="ico">◈</span>连接 QMediaSync</a>
      <a data-view="notify"><span class="ico">◔</span>通知设置</a>
      <a data-view="settings"><span class="ico">⚙</span>系统设置</a>
    </nav>
    <div class="side-foot">
      <div id="foot-user">—</div>
      <div id="foot-version" class="muted" style="margin-top:4px">v—</div>
      <div style="margin-top:6px"><a onclick="doLogout()" style="cursor:pointer">退出登录</a></div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
/* ============================================================
   基础工具
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, type=''){
  const el = document.createElement('div');
  el.className = 'toast ' + type; el.textContent = msg;
  $('#toast-root').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity=0; setTimeout(()=>el.remove(),300); }, 2600);
}

async function api(path, opts={}){
  const o = { method: opts.method || 'GET', headers:{'Content-Type':'application/json'} };
  if (opts.body !== undefined) o.body = JSON.stringify(opts.body);
  const res = await fetch(path, o);
  if (res.status === 401 && !path.includes('/api/auth/')){ showLogin(); throw new Error('未登录'); }
  let data = {};
  try { data = await res.json(); } catch(e){ data = {success:false, message:'响应解析失败'}; }
  if (!data.success && data.message) throw new Error(data.message);
  return data;
}

function modal(title, bodyHtml, footHtml='', cls=''){
  const root = $('#modal-root');
  const wrap = document.createElement('div');
  wrap.className = 'mask';
  wrap.innerHTML = `<div class="modal ${cls}">
      <div class="modal-head"><span>${esc(title)}</span><button class="x" data-close>×</button></div>
      <div class="modal-body">${bodyHtml}</div>
      ${footHtml?`<div class="modal-foot">${footHtml}</div>`:''}
    </div>`;
  wrap.addEventListener('click', e => { if (e.target === wrap || e.target.hasAttribute('data-close')) wrap.remove(); });
  root.appendChild(wrap);
  return wrap;
}

const fmtSize = n => {
  n = Number(n||0);
  if (!n) return '0 B';
  const u = ['B','KB','MB','GB','TB','PB']; let i = 0, v = n;
  while (v >= 1024 && i < u.length-1){ v /= 1024; i++; }
  return (i===0 ? v.toFixed(0) : v.toFixed(2)) + ' ' + u[i];
};
const fmtTime = t => t ? String(t).replace('T',' ').slice(0,19) : '—';

/* ============================================================
   登录
   ============================================================ */
function showLogin(){ $('#login').classList.remove('hidden'); $('#app').classList.add('hidden'); }
function showApp(){ $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); }

async function doLogin(){
  const username = $('#lg-user').value.trim(), password = $('#lg-pass').value;
  try{
    await api('/api/auth/login', {method:'POST', body:{username, password}});
    showApp(); $('#foot-user').textContent = username; switchView('dashboard');
  }catch(e){ toast(e.message, 'err'); }
}
async function doLogout(){ try{ await api('/api/auth/logout', {method:'POST'}); }catch(e){} showLogin(); }

$('#lg-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

/* ============================================================
   路由
   ============================================================ */
const VIEWS = {};
let curView = '';
function switchView(name){
  curView = name;
  $$('#nav a').forEach(a => a.classList.toggle('active', a.dataset.view === name));
  const fn = VIEWS[name];
  if (fn) fn();
}
$('#nav').addEventListener('click', e => {
  const a = e.target.closest('a[data-view]'); if (a) switchView(a.dataset.view);
});

/* ============================================================
   仪表盘
   ============================================================ */
VIEWS.dashboard = async function(){
  $('#main').innerHTML = `<div class="page-head"><div><h2>仪表盘</h2><div class="desc">账号状态 · 任务概览 · 定时计划</div></div>
    <button class="btn" onclick="VIEWS.dashboard()">刷新</button></div>
    <div id="dash-stats" class="grid"></div>
    <div class="card"><div class="card-head">已启用任务</div><div id="dash-tasks"><div class="empty">加载中…</div></div></div>
    <div class="card"><div class="card-head">定时计划</div><div id="dash-jobs"><div class="empty">加载中…</div></div></div>`;
  try{
    const [space, tasks, jobs, users] = await Promise.all([
      api('/api/user/space').catch(()=>({data:{}})),
      api('/api/tasks').catch(()=>({data:[]})),
      api('/api/scheduler/jobs').catch(()=>({data:[]})),
      api('/api/users').catch(()=>({data:{users:[]}})),
    ]);
    const sp = space.data || {}, ts = tasks.data || [], js = jobs.data || [];
    const us = (users.data && users.data.users) || [];
    const cur = us.find(u => u.current);
    const enabled = ts.filter(t => t.enabled).length;
    const running = ts.filter(t => t.running).length;
    $('#dash-stats').innerHTML = [
      statCard('当前账号', cur ? esc(cur.username) : '<span class="muted">未登录</span>', cur && cur.last_check_ok===false ? '<span class="badge err">异常</span>' : ''),
      statCard('已用空间', sp.space_total ? `${esc(sp.space_used_text)} <small>/ ${esc(sp.space_total_text)}</small>` : '<span class="muted">—</span>',
        sp.space_percent ? `<div class="bar"><i style="width:${Math.min(sp.space_percent,100)}%"></i></div><div class="muted" style="font-size:12px;margin-top:4px">${sp.space_percent}%</div>` : ''),
      statCard('任务总数', `${ts.length} <small>个</small>`, `<div class="muted" style="font-size:12px;margin-top:4px">启用 ${enabled} · 运行中 ${running}</div>`),
      statCard('定时计划', `${js.length} <small>条</small>`, js.length ? `<div class="muted" style="font-size:12px;margin-top:4px">最近：${esc(js[0].next_run || '—')}</div>` : ''),
    ].join('');

    $('#dash-tasks').innerHTML = enabled
      ? table(['任务名','保存路径','定时','最近结果','状态'], ts.filter(t=>t.enabled).map(t => [
          esc(t.name || t.url),
          `<span class="trunc mono" title="${esc(t.save_dir)}">${esc(t.save_dir)}</span>`,
          t.cron ? `<code>${esc(t.cron)}</code>` : '<span class="muted">跟随全局</span>',
          `<span class="trunc" title="${esc(t.last_message)}">${esc(t.last_message || '—')}</span>`,
          t.running ? '<span class="badge blue">执行中</span>' : (t.status==='failed' ? '<span class="badge err">上次失败</span>' : '<span class="badge ok">就绪</span>'),
        ]))
      : '<div class="empty">还没有启用的任务，去「转存任务」新建一个</div>';

    $('#dash-jobs').innerHTML = js.length
      ? table(['计划','下次执行','触发器'], js.map(j => [esc(j.name), esc(j.next_run||'—'), `<span class="mono muted">${esc(j.trigger)}</span>`]))
      : '<div class="empty">没有注册任何定时计划</div>';
  }catch(e){ $('#main').innerHTML += `<div class="empty">加载失败：${esc(e.message)}</div>`; }
};
function statCard(k, v, extra=''){ return `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div>${extra}</div>`; }
function table(headers, rows, emptyMsg='暂无数据'){
  if (!rows || !rows.length) return `<div class="empty">${emptyMsg}</div>`;
  return `<div style="overflow-x:auto"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

/* ============================================================
   账号管理
   ============================================================ */
VIEWS.users = async function(){
  $('#main').innerHTML = `<div class="page-head"><div><h2>账号管理</h2>
      <div class="desc">扫码登录 115 账号，支持多账号切换</div></div>
    <div class="btn-group">
      <button class="btn primary" onclick="qrLoginModal()">扫码登录 115</button>
      <button class="btn" onclick="cookieLoginModal()">手动粘贴 Cookie</button>
      <button class="btn" onclick="VIEWS.users()">刷新</button></div></div>
    <div id="user-list"><div class="empty">加载中…</div></div>`;
  try{
    const r = await api('/api/users'); const us = r.data.users || [];
    $('#user-list').innerHTML = `<div class="card"><div class="card-head">账号列表</div>
      ${us.length ? table(['账号','UID','状态','添加时间','操作'], us.map(u => [
        (u.current ? '<span class="badge blue">当前</span> ' : '') + esc(u.username) + (u.remark?` <span class="muted">(${esc(u.remark)})</span>`:''),
        `<span class="mono muted">${esc(u.uid||'—')}</span>`,
        u.last_check_ok === true ? `<span class="badge ok">正常</span>` : (u.last_check_ok === false ? '<span class="badge err">失效</span>' : '<span class="badge">未校验</span>'),
        `<span class="muted">${esc(u.added_at||'—')}</span>`,
        `<div class="btn-group">
          <button class="btn sm" onclick="checkUser('${esc(u.username)}')">校验</button>
          ${u.current ? '' : `<button class="btn sm" onclick="switchUser('${esc(u.username)}')">切换</button>`}
          <button class="btn sm danger" onclick="delUser('${esc(u.username)}')">删除</button></div>`
      ])) : '<div class="empty">还没有账号，点右上角「扫码登录 115」开始</div>'}</div>`;
  }catch(e){ $('#user-list').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
};

async function checkUser(name){
  toast('正在校验…');
  try{ const r = await api('/api/user/check', {method:'POST', body:{username:name}});
    const d = r.data;
    toast(`校验通过${d.nickname?'：'+d.nickname:''}（已用 ${d.space_used_text||'—'}）`, 'ok');
    VIEWS.users();
  }catch(e){ toast(e.message, 'err'); VIEWS.users(); }
}
async function switchUser(name){ try{ await api('/api/user/switch',{method:'POST',body:{username:name}}); toast('已切换','ok'); VIEWS.users(); }catch(e){ toast(e.message,'err'); } }
async function delUser(name){
  if (!confirm(`确认删除账号「${name}」？`)) return;
  try{ await api('/api/user/delete',{method:'POST',body:{username:name}}); toast('已删除','ok'); VIEWS.users(); }catch(e){ toast(e.message,'err'); }
}

let lastDiag = null;

function renderQrDebug(w, d){
  const box = $('#qr-debug', w);
  if (!box) return;
  const rows = d.debug || [];
  box.innerHTML = rows.length
    ? rows.map(r => `<div class="l"><span class="muted">${esc(r.t)}</span> <b>${esc(r.step)}</b>  ${esc(r.detail)}</div>`).join('')
    : '<div class="l muted">暂无</div>';
  box.scrollTop = box.scrollHeight;
}

function qrDiagText(){
  const d = lastDiag;
  if (!d) return '（还没有诊断信息，请先生成二维码并轮询）';
  const lines = [];
  lines.push('=== 115SavePro 扫码登录诊断 ===');
  lines.push('时间: ' + new Date().toISOString());
  lines.push('登录设备(app): ' + (d.app || ''));
  if (d.app_used) lines.push('最终成功设备: ' + d.app_used);
  lines.push('当前状态: status=' + d.status + '  ' + (d.message || ''));
  lines.push('错误: ' + (d.error || '（无）'));
  if ((d.tried_apps || []).length){
    lines.push('');
    lines.push('--- 换取凭据时自动尝试过的设备 ---');
    d.tried_apps.forEach(t => lines.push(`  ${t.ok ? '✓ 成功' : '✗ 失败'}  ${t.app}  →  ${t.detail}`));
  }
  lines.push('');
  lines.push('--- 各步原始响应 ---');
  (d.debug || []).forEach(r => lines.push(`[${r.t}] ${r.step}: ${r.detail}`));
  return lines.join('\n');
}

function qrLoginModal(){
  const w = modal('扫码登录 115', `
    <div style="display:flex;gap:20px;flex-wrap:wrap">
      <div style="text-align:center">
        <div id="qr-box" style="width:200px;height:200px;border:1px solid var(--line);border-radius:10px;
          display:flex;align-items:center;justify-content:center;background:var(--panel-2)">
          <span class="muted" style="font-size:13px">生成中…</span></div>
        <div id="qr-status" class="muted" style="margin-top:10px;font-size:13px">正在获取二维码…</div>
      </div>
      <div style="flex:1;min-width:250px">
        <div class="field"><label>登录设备</label><select id="qr-app"></select>
          <div class="hint">确认后系统会<b>自动依次尝试多个设备身份</b>换取凭据，不用手动换设备重扫。这里选的只是第一个尝试的。</div></div>
        <div class="field"><label>账号备注名（可选）</label><input type="text" id="qr-name" placeholder="留空自动用 UID 命名"></div>
        <div class="field"><label>备注（可选）</label><input type="text" id="qr-remark" placeholder="例如：主号 / 影视号"></div>
        <div class="hint">用 <b>115 手机 App</b> 扫码，扫完后<b>必须在手机上点「确认登录」</b>，否则拿不到凭据。</div>
      </div>
    </div>
    <div id="qr-err" class="hidden" style="margin-top:12px;padding:9px 11px;border-radius:8px;
      background:var(--err-soft);color:var(--err);font-size:12.5px;line-height:1.6"></div>
    <div class="field" style="margin-top:12px">
      <label>诊断信息 <span class="muted">（失败时点下方「复制诊断」把内容发我）</span></label>
      <div class="logbox" id="qr-debug" style="max-height:160px;font-size:11.5px"><div class="l muted">暂无</div></div>
    </div>`, `<button class="btn" id="qr-selftest">接口自检</button>
    <button class="btn" id="qr-regen">重新生成二维码</button>
    <button class="btn" id="qr-copydiag">复制诊断</button>
    <button class="btn" data-close>关闭</button>
    <button class="btn primary" id="qr-confirm" disabled>保存账号</button>`);
  let sid = null, timer = null, done = false;
  $('#qr-app', w).addEventListener('change', () => startQr());

  async function startQr(){
    if (timer) clearInterval(timer);
    done = false; lastDiag = null;
    $('#qr-confirm', w).disabled = true;
    $('#qr-err', w).classList.add('hidden');
    $('#qr-debug', w).innerHTML = '<div class="l muted">暂无</div>';
    $('#qr-status', w).style.color = '';
    $('#qr-status', w).textContent = '正在获取二维码…';
    $('#qr-box', w).innerHTML = '<span class="muted" style="font-size:13px">生成中…</span>';
    try{
      const r = await api('/api/qr/start', {method:'POST', body:{app: $('#qr-app', w).value}});
      sid = r.data.sid;
      $('#qr-box', w).innerHTML = `<img src="${r.data.qrcode}" style="width:190px;height:190px">`;
      $('#qr-status', w).textContent = '请用 115 手机 App 扫码';
      timer = setInterval(async () => {
        if (done) return;
        try{
          const p = await api('/api/qr/poll', {method:'POST', body:{sid}});
          const d = p.data; lastDiag = d;
          $('#qr-status', w).textContent = d.message;
          if (d.status === 1) $('#qr-status', w).style.color = 'var(--ok)';
          renderQrDebug(w, d);
          if (d.done){
            done = true; clearInterval(timer);
            if (d.has_cookie){
              $('#qr-confirm', w).disabled = false;
              $('#qr-status', w).textContent = '登录成功'
                + (d.app_used ? `（设备：${d.app_used}）` : '') + '，点「保存账号」完成';
              $('#qr-status', w).style.color = 'var(--ok)';
            } else {
              $('#qr-status', w).style.color = 'var(--err)';
              const eb = $('#qr-err', w);
              eb.classList.remove('hidden');
              eb.innerHTML = '<b>登录失败</b>：' + esc(d.error || d.message)
                + '<br>① 点下方「<b>复制诊断</b>」把内容发出来 —— 里面含每个设备的详细报错，能一次定位'
                + '<br>② 换网络 / 关掉代理后重试（115 对 IP 的风控）'
                + '<br>③ 兜底：改用「<b>手动粘贴 Cookie</b>」，转存功能并不依赖扫码';
            }
          }
        }catch(e){ /* 轮询失败忽略 */ }
      }, 2000);
    }catch(e){
      $('#qr-status', w).textContent = '获取二维码失败：' + e.message;
      $('#qr-status', w).style.color = 'var(--err)';
    }
  }

  (async () => {
    try{
      const apps = await api('/api/apps');
      $('#qr-app', w).innerHTML = apps.data.map(a=>`<option value="${esc(a.value)}">${esc(a.label)}</option>`).join('');
      startQr();
    }catch(e){
      $('#qr-status', w).textContent = '加载设备列表失败：' + e.message;
      $('#qr-status', w).style.color = 'var(--err)';
    }
  })();

  w.addEventListener('click', async e => {
    if (e.target.id === 'qr-regen'){ startQr(); return; }
    if (e.target.id === 'qr-copydiag'){
      const txt = qrDiagText();
      try{
        await navigator.clipboard.writeText(txt);
        toast('诊断信息已复制，粘贴发给我即可', 'ok');
      }catch(err){
        modal('诊断信息（手动复制）', `<div class="logbox" style="max-height:400px">${esc(txt)}</div>`, '<button class="btn" data-close>关闭</button>', 'wide');
      }
      return;
    }
    if (e.target.id === 'qr-selftest'){
      const app = $('#qr-app', w).value;
      try{
        const r = await api('/api/qr/selftest', {method:'POST', body:{app}});
        const d = r.data;
        modal('扫码登录自检 · ' + esc(d.app),
          '<div class="muted" style="margin-bottom:10px;font-size:12.5px">这个自检不需要真的扫码，只验证 115 的三个接口是否都通。</div>'
          + table(['步骤','结果','详情'], (d.steps||[]).map(s=>[
              esc(s.step),
              s.ok ? '<span class="badge ok">通过</span>' : '<span class="badge err">失败</span>',
              `<span class="mono" style="font-size:12px">${esc(s.detail)}</span>`
            ]))
          + `<div style="margin-top:12px">${d.all_ok
              ? '<span class="badge ok">三个接口全部正常</span> 说明代码侧没问题；若扫码后仍失败，多半是 115 风控（换网络或改用「手动粘贴 Cookie」）'
              : '<span class="badge err">有接口失败</span> 把上面的详情发我，我来定位'}</div>`);
      }catch(err){ toast(err.message, 'err'); }
    }
    if (e.target.id === 'qr-confirm'){
      try{
        const r = await api('/api/qr/commit', {method:'POST', body:{sid, username: $('#qr-name', w).value.trim(), remark: $('#qr-remark', w).value.trim()}});
        toast('账号已保存：' + r.data.username, 'ok'); clearInterval(timer); w.remove();
        if (curView === 'users') VIEWS.users();
      }catch(e){ toast(e.message, 'err'); }
    }
    if (e.target.hasAttribute('data-close')){ clearInterval(timer); if (sid) api('/api/qr/cancel',{method:'POST',body:{sid}}).catch(()=>{}); }
  });
}

      <button class="btn primary" onclick="taskEditModal()">新建任务</button>

  try{
    const r = await api('/api/tasks'); const ts = r.data || [];

                       : `<span class="trunc mono" title="${esc(t.save_dir)}">${esc(t.save_dir)}</span>`,
        t.cron ? `<code>${esc(t.cron)}</code>` : '<span class="muted">跟随全局</span>',
        {name:'文件名',name_size:'文件名+大小',sha1:'SHA1'}[t.dedupe_mode] || t.dedupe_mode,
        t.enabled ? '<span class="badge ok">启用</span>' : '<span class="badge">停用</span>',
        `<span class="trunc" title="${esc(t.last_message)}">${esc(t.last_message || '—')}</span>`,
        `<div class="btn-group">
          <button class="btn sm primary" onclick="execTask('${t.task_uid}')">执行</button>
          <button class="btn sm" onclick="taskLogModal('${t.task_uid}','${esc(t.name||'')}')">日志</button>
          <button class="btn sm" onclick="taskEditModal('${t.task_uid}')">编辑</button>

async function execTask(uid){
  try{ await api('/api/task/execute',{method:'POST',body:{task_uid:uid}}); toast('已开始执行','ok'); taskLogModal(uid,'实时日志',true); }catch(e){ toast(e.message,'err'); }
}
async function execAll(){ try{ const r = await api('/api/tasks/execute-all',{method:'POST',body:{}}); toast(r.data.message,'ok'); setTimeout(()=>VIEWS.tasks(),1200); }catch(e){ toast(e.message,'err'); } }
async function toggleTask(uid, en){ try{ await api('/api/task/toggle',{method:'POST',body:{task_uid:uid, enabled:en}}); VIEWS.tasks(); }catch(e){ toast(e.message,'err'); } }
async function delTask(uid){ if(!confirm('确认删除该任务？')) return;
  try{ await api('/api/task/delete',{method:'POST',body:{task_uid:uid}}); toast('已删除','ok'); VIEWS.tasks(); }catch(e){ toast(e.message,'err'); } }

async function taskLogModal(uid, title, live=false){
  const w = modal('执行日志 · ' + (title||''), `<div class="logbox" id="logbox"><div class="l muted">加载中…</div></div>`,
    `<button class="btn" data-close>关闭</button><button class="btn" onclick="VIEWS.tasks()">返回列表</button>`);
  async function load(){
    try{
      const r = await api('/api/task/status/' + uid);
      const d = r.data;
      const box = $('#logbox', w); if (!box) return false;
      if (!d.exists){
        const h = await api('/api/task/history/' + uid);
        const rec = (h.data||[])[0];
        box.innerHTML = rec ? renderHistory(rec) : '<div class="l muted">暂无记录</div>';
        return false;
      }
      box.innerHTML = (d.log||[]).map(l => {
        const m = l.match(/^\[(\w+)\]\s*([\s\S]*)$/);
        const lv = m ? m[1] : 'INFO', txt = m ? m[2] : l;
        return `<div class="l ${lv}">${esc(txt)}</div>`;
      }).join('') + (d.finished ? '' : '<div class="l muted">执行中…</div>');
      box.scrollTop = box.scrollHeight;
      return !d.finished;
    }catch(e){ return false; }
  }
  const keep = await load();
  let t = null;
  if (keep) t = setInterval(async ()=>{ if (!(await load())){ clearInterval(t); VIEWS.tasks(); } }, 1500);
  w.addEventListener('click', e => { if (e.target.hasAttribute('data-close') && t) clearInterval(t); });
}
function renderHistory(rec){
  const lines = [];
  lines.push(`<div class="l"><b>任务</b>：${esc(rec.task_name||'')}</div>`);
  lines.push(`<div class="l"><b>时间</b>：${esc(rec.start_time)} → ${esc(rec.end_time)}</div>`);
  lines.push(`<div class="l"><b>结果</b>：${rec.success?'✅ 成功':'❌ 失败'} ${esc(rec.message||'')}</div>`);
  lines.push(`<div class="l"><b>转存数</b>：${rec.file_count||0}</div>`);
  if ((rec.skipped||[]).length) lines.push(`<div class="l"><b>去重跳过</b>：${(rec.skipped||[]).slice(0,40).map(esc).join('、')}</div>`);
  if ((rec.new_items||[]).length) lines.push(`<div class="l"><b>新增</b>：${(rec.new_items||[]).map(i=>esc(i.name)).join('、')}</div>`);
  if (rec.qms_result) lines.push(`<div class="l"><b>QMS</b>：${esc(rec.qms_result)}</div>`);
  lines.push('<div class="l">─────────</div>');
  (rec.log||[]).forEach(l => {
    const m = l.match(/^\[(\w+)\]\s*([\s\S]*)$/);
    lines.push(`<div class="l ${m?m[1]:'INFO'}">${esc(m?m[2]:l)}</div>`);
  });
  return lines.join('');
}

let tfSelection = [];   // 选中的分享内文件夹 id

async function taskEditModal(uid){

  const w = modal(t ? '编辑任务' : '新建任务', `

      <div class="inline"><input type="text" id="f-cmp" value="${esc(t?t.compare_path:'')}" placeholder="留空则与保存路径比对">

    <div class="row">
      <div class="field"><label>去重模式</label>
        <select id="f-dedupe">
          <option value="name">按文件名</option>
          <option value="name_size">按文件名 + 大小</option>

        </select></div>
      <div class="field"><label>定时规则（cron）</label><input type="text" id="f-cron" value="${esc(t?t.cron:'')}" placeholder="留空则跟随全局定时"></div>

        <div class="hint">只转存匹配的文件名；目录不受影响</div></div>
      <div class="field"><label>正则替换（可选）</label><input type="text" id="f-rp" value="${esc(t?t.regex_replace:'')}" placeholder="留空则不重命名"></div>
    </div>
    <div class="field"><label>排除文件清单 <span class="muted">（每行一个文件名，命中则跳过）</span></label>
      <textarea id="f-ex" style="min-height:64px">${esc((t?(t.exclude_files||[]):[]).join('\n'))}</textarea></div>
    <div class="field"><label>指定转存文件夹 <span class="muted">（不选=整条分享全部转存）</span></label>
      <div class="inline">
        <input type="text" id="f-tf" readonly value="${tfSelection.length?('已选 '+tfSelection.length+' 项'):'未选择（转存全部）'}" style="background:var(--panel-2)">

      </div></div>
    <div class="row">
      <div class="field"><label class="chk"><input type="checkbox" id="f-en" ${(!t||t.enabled)?'checked':''}> 启用该任务</label></div>

        <div class="hint">不用再去列表里点「执行」。执行成功后会自动触发 QMS 生成 strm 与刮削（需先在「连接 QMediaSync」里绑定）。</div></div>

  $('#f-dedupe', w).value = t ? (t.dedupe_mode||'name') : 'name';

      transfer_file_ids: tfSelection,
      enabled: $('#f-en',w).checked,

      const r = t
        ? await api('/api/task/update', {method:'POST', body:{task_uid:t.task_uid, data:body, auto_run:autoRun}})

/* --------- 目录选择器 --------- */
function pickDir(inputId){
  let stack = [{cid:0,name:'根目录'}];
  const w = modal('选择 115 目录', `
    <div class="crumbs" id="crumbs"></div>
    <div class="picklist" id="plist"><div class="empty">加载中…</div></div>`,
    `<button class="btn" data-close>取消</button>
     <button class="btn primary" id="pd-ok">选择当前目录</button>`, 'wide');
  async function load(){
    $('#crumbs',w).innerHTML = stack.map((s,i)=>`<span class="c" data-i="${i}">${esc(s.name)}</span>`).join('<span class="sep">/</span>');
    try{
      const r = await api('/api/dir/list?cid=' + stack[stack.length-1].cid);
      const items = r.data.items || [];
      $('#plist',w).innerHTML = items.length ? items.map(i =>
        `<div class="pickrow" data-cid="${i.id}" data-name="${esc(i.name)}"><span>📁</span><span class="nm">${esc(i.name)}</span><span class="muted">›</span></div>`
      ).join('') : '<div class="empty">该目录下没有子目录</div>';
    }catch(e){ $('#plist',w).innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }
  w.addEventListener('click', e => {
    const c = e.target.closest('.c');
    if (c){ stack = stack.slice(0, Number(c.dataset.i)+1); load(); return; }
    const row = e.target.closest('.pickrow');
    if (row){ stack.push({cid:Number(row.dataset.cid), name: row.dataset.name}); load(); return; }
    if (e.target.id === 'pd-ok'){
      const path = '/' + stack.slice(1).map(s=>s.name).join('/');
      const val = stack.length === 1 ? '/' : path;
      const el = document.getElementById(inputId); if (el) el.value = val;
      w.remove();
    }
  });
  load();
}

  });
  w.addEventListener('change', e => {

}

   ============================================================ */
let fileStack = [{cid:0,name:'根目录'}];
let fileSel = new Set();
VIEWS.files = async function(){
  fileStack = [{cid:0,name:'根目录'}]; fileSel = new Set();
  $('#main').innerHTML = `<div class="page-head"><div><h2>文件管理</h2>
      <div class="desc">浏览 / 新建 / 重命名 / 移动 / 复制 / 删除 / 生成分享</div></div>
    <div class="btn-group"><button class="btn" onclick="fileSearch()">搜索</button>

      <button class="btn" onclick="fileAct('move')">移动选中</button>
      <button class="btn" onclick="fileAct('copy')">复制选中</button>
      <button class="btn" onclick="fileAct('share')">生成分享</button>
      <button class="btn danger" onclick="fileAct('delete')">删除选中</button></div></div>
    <div class="card"><div class="card-head"><div class="crumbs" id="f-crumbs" style="margin:0"></div>
      <span class="muted" id="f-sel"></span></div><div id="f-list"><div class="empty">加载中…</div></div></div>`;
  loadFiles();
};
async function loadFiles(){
  const cur = fileStack[fileStack.length-1];
  $('#f-crumbs').innerHTML = fileStack.map((s,i)=>`<span class="c" data-i="${i}">${esc(s.name)}</span>`).join('<span class="sep">/</span>');
  $('#f-sel').textContent = fileSel.size ? ('已选 ' + fileSel.size + ' 项') : '';
  try{
    const r = await api('/api/files/list?cid=' + cur.cid + '&limit=300');
    const items = r.data.items || [];
    $('#f-list').innerHTML = items.length ? table(['','名称','大小','修改时间','操作'], items.map(i => [
      `<input type="checkbox" data-fid="${i.id}" ${fileSel.has(String(i.id))?'checked':''}>`,
      i.is_dir ? `<span style="cursor:pointer" data-enter="${i.id}" data-name="${esc(i.name)}">📁 <b>${esc(i.name)}</b></span>`
               : `📄 ${esc(i.name)}`,
      i.is_dir ? '—' : fmtSize(i.size),
      `<span class="muted">${i.mtime ? fmtTime(new Date(i.mtime*1000).toISOString()) : '—'}</span>`,
      `<div class="btn-group"><button class="btn sm" onclick="fileRename(${i.id},'${esc(i.name).replace(/'/g,"\\'")}')">重命名</button></div>`
    ])) : '<div class="empty">空目录</div>';
  }catch(e){ $('#f-list').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
document.addEventListener('click', e => {
  const c = e.target.closest('#f-crumbs .c');
  if (c){ fileStack = fileStack.slice(0, Number(c.dataset.i)+1); fileSel = new Set(); loadFiles(); return; }
  const en = e.target.closest('[data-enter]');
  if (en && $('#f-list')){ fileStack.push({cid:Number(en.dataset.enter), name:en.dataset.name}); fileSel = new Set(); loadFiles(); }
});
document.addEventListener('change', e => {
  const cb = e.target.closest('#f-list input[type=checkbox][data-fid]'); if (!cb) return;
  const id = String(cb.dataset.fid);
  if (cb.checked) fileSel.add(id); else fileSel.delete(id);
  $('#f-sel') && ($('#f-sel').textContent = fileSel.size ? ('已选 ' + fileSel.size + ' 项') : '');
});
function fileMkdir(){
  const name = prompt('新建文件夹名称：'); if (!name) return;
  api('/api/files/mkdir',{method:'POST',body:{cid:fileStack[fileStack.length-1].cid, name}})
    .then(()=>{ toast('已创建','ok'); loadFiles(); }).catch(e=>toast(e.message,'err'));
}
function fileRename(fid, old){
  const name = prompt('新名称：', old); if (!name || name === old) return;
  api('/api/files/rename',{method:'POST',body:{fid, name}})
    .then(()=>{ toast('已重命名','ok'); loadFiles(); }).catch(e=>toast(e.message,'err'));
}
function fileAct(kind){
  const fids = Array.from(fileSel).map(Number);
  if (!fids.length){ toast('请先勾选文件','err'); return; }
  if (kind === 'delete'){
    if (!confirm(`确认删除选中的 ${fids.length} 项？`)) return;
    api('/api/files/delete',{method:'POST',body:{fids}}).then(()=>{ toast('已删除','ok'); fileSel=new Set(); loadFiles(); }).catch(e=>toast(e.message,'err'));
    return;
  }
  if (kind === 'share'){
    api('/api/files/share',{method:'POST',body:{fids}}).then(r=>{
      const url = r.data.share_url || '（未返回链接）';
      modal('分享已创建', `<div class="field"><label>分享链接</label>
        <div class="inline"><input type="text" value="${esc(url)}" readonly><button class="btn" onclick="navigator.clipboard.writeText('${esc(url)}');toast('已复制','ok')">复制</button></div></div>`);
    }).catch(e=>toast(e.message,'err'));
    return;
  }
  // move / copy 需要选目标目录
  let stack = [{cid:0,name:'根目录'}];
  const w = modal(kind==='move'?'移动到…':'复制到…', `<div class="crumbs" id="mc"></div>
    <div class="picklist" id="ml"><div class="empty">加载中…</div></div>`,
    `<button class="btn" data-close>取消</button><button class="btn primary" id="mok">确定</button>`);
  async function load(){
    $('#mc',w).innerHTML = stack.map((s,i)=>`<span class="c" data-i="${i}">${esc(s.name)}</span>`).join('<span class="sep">/</span>');
    try{
      const r = await api('/api/dir/list?cid=' + stack[stack.length-1].cid);
      const items = r.data.items || [];
      $('#ml',w).innerHTML = items.length ? items.map(i=>`<div class="pickrow" data-cid="${i.id}" data-name="${esc(i.name)}"><span>📁</span><span class="nm">${esc(i.name)}</span><span class="muted">›</span></div>`).join('') : '<div class="empty">没有子目录</div>';
    }catch(e){ $('#ml',w).innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }
  w.addEventListener('click', async e => {
    const c = e.target.closest('.c'); if (c){ stack = stack.slice(0,Number(c.dataset.i)+1); load(); return; }
    const row = e.target.closest('.pickrow'); if (row){ stack.push({cid:Number(row.dataset.cid), name:row.dataset.name}); load(); return; }
    if (e.target.id === 'mok'){
      const target_cid = stack[stack.length-1].cid;
      try{
        await api(kind==='move'?'/api/files/move':'/api/files/copy',{method:'POST',body:{fids, target_cid}});
        toast('操作成功','ok'); w.remove(); fileSel = new Set(); loadFiles();
      }catch(err){ toast(err.message,'err'); }
    }
  });
  load();
}
function fileSearch(){
  const kw = prompt('搜索关键词：'); if (!kw) return;
  api('/api/files/search',{method:'POST',body:{keyword:kw}}).then(r=>{
    const items = r.data || [];
    modal('搜索结果：' + kw, items.length ? table(['名称','大小'], items.map(i=>[esc(i.name), i.is_dir?'—':fmtSize(i.size)])) : '<div class="empty">没有结果</div>');
  }).catch(e=>toast(e.message,'err'));
}

function qmsWaitFields(prefix, link){
  const modes = window.__qmsWaitModes && window.__qmsWaitModes.length
    ? window.__qmsWaitModes
    : [{value:'poll',label:'轮询等待 strm 同步结束（推荐）'},{value:'delay',label:'固定延迟若干秒'},{value:'none',label:'不等待，立即刮削'}];
  const mode = link.wait_mode || 'poll';
  return `
    <div class="row" style="margin-top:4px">
      <div class="field"><label>等待方式</label><select id="${prefix}-wait">
        ${modes.map(m=>`<option value="${esc(m.value)}" ${mode===m.value?'selected':''}>${esc(m.label)}</option>`).join('')}
      </select></div>
      <div class="field" style="max-width:170px"><label>固定延迟（秒）</label>
        <input type="text" id="${prefix}-wsec" value="${esc(link.wait_seconds||15)}"></div>
      <div class="field" style="max-width:170px"><label>最长等待（秒）</label>
        <input type="text" id="${prefix}-wto" value="${esc(link.wait_timeout||900)}"></div>
    </div>
    <div class="hint">「轮询」会一直等到 QMS 的同步任务结束（is_running 归零）再刮削，比固定睡眠可靠；
      超时则照常继续刮削，已生成的 strm 仍会被刮到。</div>`;
}
function qmsWaitPayload(prefix){
  return {
    wait_mode: $('#'+prefix+'-wait').value,
    wait_seconds: Number($('#'+prefix+'-wsec').value || 15),
    wait_timeout: Number($('#'+prefix+'-wto').value || 900),
  };
}
async function qmsLinkAdd(){

  if (!pathes.length){ toast('QMS 里没有刮削目录','err'); return; }
  const syncPaths = await qmsLoadSyncPaths();
  const tasks = (await api('/api/tasks')).data || [];
  const syncOpts = (syncPaths || []).map(s =>
    `<option value="${esc(s.id)}" data-name="${esc(s.name)}">#${esc(s.id)} ${esc(s.name)}</option>`).join('');
  const w = modal('创建连接', `
    <div class="field"><label>绑定对象</label><select id="ql-scope">
      <option value="task">某个转存任务（转存到新文件后触发）</option>
      <option value="offline">离线下载完成（任一下载完成都触发）</option></select></div>
    <div class="field" id="ql-task-wrap"><label>选择转存任务</label><select id="ql-task">
      ${tasks.map(t=>`<option value="${esc(t.task_uid)}" data-name="${esc(t.name||t.url)}">${esc(t.name||t.url)} → ${esc(t.save_dir)}</option>`).join('') || '<option value="">（还没有转存任务）</option>'}
    </select></div>
    <div class="field"><label>① 先生成 strm（可选）</label><select id="ql-sync">
      <option value="">不生成，直接刮削</option>
      ${syncOpts}
    </select>
    <div class="hint">${syncPaths === null
      ? '（拉取同步路径失败，可先去 QMS 确认存在同步路径；也可以不选，走原来的直接刮削）'
      : '选中后会先触发「同步路径」生成 strm —— 顺序不能反，没有 strm 就刮不到东西。'}</div>
    </div>
    <div id="ql-wait-wrap" class="hidden">${qmsWaitFields('ql', {})}</div>
    <div class="field"><label>② 刮削任务</label><select id="ql-qms">
      ${pathes.map(p=>`<option value="${esc(p.id)}" data-path="${esc(p.source_path)}" data-media="${esc(p.media_type)}">#${esc(p.id)} ${esc(p.media_type)} · ${esc(p.source_path)}</option>`).join('')}
    </select></div>
    <div class="hint">提示：QMS 的「源目录」应当是 115 目录挂载到本机后的实际路径（例如通过 CloudDrive2 挂载）。</div>`,
    `<button class="btn" data-close>取消</button><button class="btn primary" id="ql-ok">创建</button>`);
  $('#ql-scope',w).addEventListener('change', e => { $('#ql-task-wrap',w).style.display = e.target.value === 'task' ? '' : 'none'; });
  const syncSel = $('#ql-sync', w);
  const toggleWait = () => $('#ql-wait-wrap', w).classList.toggle('hidden', !syncSel.value);
  syncSel.addEventListener('change', toggleWait); toggleWait();
  w.addEventListener('click', async e => {
    if (e.target.id !== 'ql-ok') return;
    const scope = $('#ql-scope',w).value;
    const sel = $('#ql-qms',w).selectedOptions[0];
    const tsel = $('#ql-task',w).selectedOptions[0];
    const ssel = syncSel.selectedOptions[0];
    try{
      await api('/api/qms/link/add',{method:'POST',body:Object.assign({
        scope, qms_id: Number(sel.value), qms_path: sel.dataset.path, qms_media_type: sel.dataset.media,
        task_uid: scope==='task' ? (tsel?tsel.value:'') : '',
        task_name: scope==='task' ? (tsel?tsel.dataset.name:'') : '离线下载',
        sync_path_id: syncSel.value ? Number(syncSel.value) : null,
        sync_path_name: (syncSel.value && ssel) ? ssel.dataset.name : '',
      }, qmsWaitPayload('ql'))});
      toast('连接已创建','ok'); w.remove(); VIEWS.qms();

async function qmsEditLink(id){

  if (!link){ toast('连接不存在','err'); return; }
  let pathes = [];
  try{ pathes = (await api('/api/qms/pathes',{method:'POST',body:qmsForm()})).data || []; }catch(e){}
  const syncPaths = await qmsLoadSyncPaths();
  const syncOpts = (syncPaths || []).map(s =>
    `<option value="${esc(s.id)}" data-name="${esc(s.name)}" ${String(s.id)===String(link.sync_path_id)?'selected':''}>#${esc(s.id)} ${esc(s.name)}</option>`).join('');
  const qmsOpts = (pathes || []).map(p =>
    `<option value="${esc(p.id)}" data-path="${esc(p.source_path)}" data-media="${esc(p.media_type)}" ${String(p.id)===String(link.qms_id)?'selected':''}>#${esc(p.id)} ${esc(p.media_type)} · ${esc(p.source_path)}</option>`).join('');
  const w = modal('编辑连接', `
    <div class="field"><label>绑定对象</label><input type="text" readonly style="background:var(--panel-2)"
      value="${esc(link.scope==='offline' ? '离线下载完成后' : ('任务：' + (link.task_name||link.task_uid)))}"></div>
    <div class="field"><label>① 先生成 strm（可选）</label><select id="qe-sync">
      <option value="">不生成，直接刮削</option>${syncOpts}</select>
      ${syncPaths === null ? '<div class="hint">拉取同步路径失败，下拉里可能缺项 —— 可先去 QMS 确认。</div>' : ''}
    </div>
    <div id="qe-wait-wrap" class="${link.sync_path_id?'':'hidden'}">${qmsWaitFields('qe', link)}</div>
    <div class="field"><label>② 刮削任务</label><select id="qe-qms">
      ${qmsOpts || `<option value="${esc(link.qms_id)}">#${esc(link.qms_id)}（当前值，拉取失败）</option>`}
    </select></div>`,
    `<button class="btn" data-close>取消</button><button class="btn primary" id="qe-ok">保存</button>`);
  const ss = $('#qe-sync', w);
  const tg = () => $('#qe-wait-wrap', w).classList.toggle('hidden', !ss.value);
  ss.addEventListener('change', tg); tg();
  w.addEventListener('click', async e => {
    if (e.target.id !== 'qe-ok') return;
    const qsel = $('#qe-qms', w).selectedOptions[0];
    const ssel = ss.selectedOptions[0];
    try{
      await api('/api/qms/link/update',{method:'POST',body:Object.assign({
        id, qms_id: Number(qsel.value),
        qms_path: (qsel && qsel.dataset.path) || link.qms_path,
        sync_path_id: ss.value ? Number(ss.value) : null,
        sync_path_name: (ss.value && ssel) ? ssel.dataset.name : '',
      }, qmsWaitPayload('qe'))});
      toast('已保存','ok'); w.remove(); VIEWS.qms();
    }catch(err){ toast(err.message,'err'); }
  });
}

        </div>
        <div style="margin-top:18px">
          <div class="hint" style="margin-bottom:8px">服务器上的备份（<code>config/backups</code>，最多保留 <span id="bk-max">20</span> 份）</div>
          <div id="bk-list"><div class="empty" style="padding:6px 0">加载中…</div></div>
        </div>
        <input type="file" id="bk-file" accept=".json,application/json" style="display:none">
      </div></div>
      <div class="card"><div class="card-head">版本更新</div><div class="card-body" id="st-upd">
        <div class="empty" style="padding:6px 0">正在检查…</div></div></div>`;
  }catch(e){ $('#st-box').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  loadUpdateCard();
  bkLoad();
};

/* ------------------------------------------------------------
   备份与恢复
   ------------------------------------------------------------ */
function bkOpts(){
  return {
    cookies: $('#bk-cookies').checked,
    auth: $('#bk-auth').checked,
    history: $('#bk-history').checked,
  };
}

function bkSummaryText(s){
  if (!s) return '—';
  const p = [];
  if (s.users) p.push(s.users + ' 账号' + (s.users_with_cookie < s.users ? `（${s.users_with_cookie} 个含凭据）` : ''));
  if (s.tasks) p.push(s.tasks + ' 任务');
  if (s.qms_links) p.push(s.qms_links + ' QMS 联动');
  if (s.history) p.push(s.history + ' 条历史');
  return p.length ? p.join(' · ') : '（空）';
}

async function bkExport(download){
  const o = bkOpts();
  if (download && !o.cookies &&
      !confirm('你取消了「包含账号 Cookie」，这份备份恢复后需要重新登录 115 账号。\n\n确认继续导出？')) return;
  try{
    const r = await api('/api/backup/export', {method:'POST', body:Object.assign({}, o, {save: !download})});
    const d = r.data || {};
    if (download){
      const blob = new Blob([JSON.stringify(d.payload, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = d.filename || '115savepro-backup.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} }, 6000);
      toast('已生成备份文件，浏览器开始下载','ok');
    } else {
      toast('已备份到服务器：' + (d.saved_name || ''),'ok');
    }
    bkLoad();
  }catch(e){ toast(e.message,'err'); }
}

async function bkLoad(){
  const box = $('#bk-list');
  if (!box) return;
  try{
    const r = await api('/api/backup/list');
    const d = r.data || {};
    if ($('#bk-max')) $('#bk-max').textContent = d.max_local || 20;
    const items = d.items || [];
    box.innerHTML = table(['时间','来源','内容','大小','操作'], items.map(it => [
      esc(it.created_at),
      `<span class="badge ${it.tag==='before-restore'?'warn':'blue'}">${esc(it.tag_text||it.tag)}</span>`,
      it.invalid ? `<span style="color:var(--err)">${esc(it.error||'文件异常')}</span>`
                 : esc(it.summary ? bkSummaryText(it.summary) : '（文件较大，未解析摘要）'),
      esc(it.size_text),
      `<div class="btn-group">
        <button class="btn sm" onclick="bkRestoreLocal('${esc(it.name)}')">恢复</button>
        <a class="btn sm" href="/api/backup/download/${encodeURIComponent(it.name)}">下载</a>
        <button class="btn sm danger" onclick="bkDelete('${esc(it.name)}')">删除</button></div>`
    ]), '还没有服务器备份。点上面「备份到服务器」先存一份。');
  }catch(e){ box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

async function bkDelete(name){
  if (!confirm('确认删除这份备份？\n\n' + name + '\n\n（这是不可撤销的操作）')) return;
  try{ await api('/api/backup/delete',{method:'POST',body:{name}}); toast('已删除','ok'); bkLoad(); }
  catch(e){ toast(e.message,'err'); }
}

function bkPickFile(){
  const inp = $('#bk-file');
  inp.value = '';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    if (f.size > 32*1024*1024){ toast('文件超过 32MB，拒绝了','err'); return; }
    let text = '';
    try { text = await f.text(); }catch(e){ toast('读取文件失败：' + e.message,'err'); return; }
    bkPreview({content: text}, '/api/backup/import', '文件 ' + f.name);
  };
  inp.click();
}

async function bkRestoreLocal(name){
  bkPreview({name}, '/api/backup/restore', name);
}

async function bkPreview(reqBody, endpoint, label){
  let pv = null;
  try{ pv = (await api('/api/backup/preview',{method:'POST',body:reqBody})).data; }
  catch(e){ toast('无法读取这份备份：' + e.message,'err'); return; }
  bkRestoreDialog(pv, label, (mode, parts) =>
    api(endpoint, {method:'POST', body:Object.assign({}, reqBody, {mode, parts})}));
}

function bkRestoreDialog(pv, label, doRestore){
  const s = pv.summary || {};
  const parts = pv.available_parts || [];
  const w = modal('恢复备份', `
    <div class="hint">来源：<b>${esc(label)}</b></div>
    <div class="hint">备份时间：${esc(pv.exported_at || '未知')}　程序版本：${esc(pv.version || '未知')}</div>
    <div class="hint">这份备份包含：<b>${esc(bkSummaryText(s))}</b></div>
    ${pv.cookies_omitted ? '<div class="hint" style="color:var(--warn);margin-top:6px">⚠️ 这份备份<b>不含账号 Cookie</b>，恢复后需要重新登录 115。</div>' : ''}
    <div class="field" style="margin-top:16px"><label>恢复方式</label>
      <label class="chk" style="display:block;margin:6px 0">
        <input type="radio" name="bk-mode" value="replace" checked> <b>覆盖</b>
        <span class="muted">— 用备份内容替换现有配置，结果和备份时完全一致</span></label>
      <label class="chk" style="display:block">
        <input type="radio" name="bk-mode" value="merge"> <b>合并</b>
        <span class="muted">— 账号 / 任务 / QMS 连接按 ID 合并，当前多出来的部分保留</span></label>
    </div>
    <div class="field"><label>恢复内容</label>
      ${parts.map(p=>`<label class="chk" style="display:block;margin:4px 0">
        <input type="checkbox" class="bk-part" value="${esc(p.key)}" checked> ${esc(p.label)}</label>`).join('')
        || '<div class="hint" style="color:var(--err)">这份备份里没有可恢复的内容</div>'}
    </div>
    <div class="hint" style="margin-top:12px">恢复前会自动把<b>当前状态</b>存一份到服务器（来源标为「恢复前自动存档」），选错文件也能退回来。</div>`,
    `<button class="btn" data-close>取消</button>
     <button class="btn danger" id="bk-do" ${parts.length?'':'disabled'}>确认恢复</button>`);

  w.addEventListener('click', async e => {
    if (e.target.id !== 'bk-do') return;
    const mode = (w.querySelector('input[name="bk-mode"]:checked') || {}).value || 'replace';
    const sel = Array.from(w.querySelectorAll('.bk-part:checked')).map(x => x.value);
    if (!sel.length){ toast('至少选一项要恢复的内容','err'); return; }
    const okGo = mode === 'replace'
      ? confirm('将用这份备份【覆盖】所选内容，当前配置会被替换。\n\n（当前状态已自动存档，可在备份列表里退回）\n\n确认继续？')
      : confirm('将以【合并】方式恢复所选内容。\n\n确认继续？');
    if (!okGo) return;
    const btn = e.target;
    btn.disabled = true; btn.textContent = '恢复中…';
    try{
      const r = await doRestore(mode, sel);
      w.remove();
      bkShowResult(r.data || {});
      bkLoad();
      if (VIEWS.settings) VIEWS.settings();
    }catch(err){
      btn.disabled = false; btn.textContent = '确认恢复';
      toast(err.message,'err');
    }
  });
}

function bkShowResult(rep){
  const lines = (rep.detail || []).map(x=>`<div>✓ ${esc(x)}</div>`).join('');
  const warn = (rep.skipped || []).map(x=>`<div style="color:var(--warn)">! ${esc(x)}</div>`).join('');
  const hist = (rep.history && Object.keys(rep.history).length)
    ? `<div class="hint" style="margin-top:8px">历史写入：${Object.entries(rep.history).map(([k,v])=>`${esc(k)} ${v} 条`).join('　')}</div>`
    : '';
  const w = modal('恢复完成', `
    <div class="hint" style="color:var(--ok)">已按「${rep.mode === 'merge' ? '合并' : '覆盖'}」方式恢复完成。</div>
    <div style="margin-top:10px;line-height:2">${lines || '<span class="muted">没有发生变化</span>'}</div>
    ${warn ? `<div style="margin-top:10px;line-height:2">${warn}</div>` : ''}
    ${hist}
    ${rep.safety_backup ? `<div class="hint" style="margin-top:10px">恢复前已自动存档：<code>${esc(rep.safety_backup)}</code></div>` : ''}
    <div class="hint" style="margin-top:10px">如果恢复的账号或任务没立刻出现，刷新页面即可。</div>`,
    '<button class="btn primary" data-close>知道了</button>');
  return w;
}

/* ------------------------------------------------------------
   版本更新（检查 + 一键更新）
   ------------------------------------------------------------ */
async function loadUpdateCard(){
  const box = $('#st-upd');
  if (!box) return;
  box.innerHTML = '<div class="empty" style="padding:6px 0">正在检查…</div>';

  let env = {}, chk = {};
  try { env = (await api('/api/update/env')).data || {}; }
  catch(e){ env = { supported:false, reason: e.message }; }
  try { chk = (await api('/api/update/check')).data || {}; }
  catch(e){ chk = { ok:false, error: e.message }; }

  const cur = env.version || APP_VERSION || '?';
  const hasNew = !!chk.has_update;
  const latestTxt = chk.ok ? ('v' + (chk.latest || '?')) : '检查失败';

  let statusHtml;
  if (!chk.ok){
    statusHtml = `<div class="hint" style="color:var(--err)">${esc(chk.error || '检查失败')}</div>`;
  } else if (hasNew){
    statusHtml = `<div class="hint" style="color:var(--ok)">发现新版本 <b>v${esc(chk.latest)}</b>`
      + (chk.published_at ? `（${esc(chk.published_at.slice(0,10))} 发布）` : '') + '</div>';
  } else {
    statusHtml = '<div class="hint" style="color:var(--ok)">已是最新版本</div>';
  }

  let noteHtml = '';
  if (!env.supported){
    // 把「为什么不行」拆成可执行的信息，而不是一句笼统的"不支持"
    const diag = [];
    if (env.socket_exists === false) diag.push(`容器内 <code>${esc(env.socket||'/var/run/docker.sock')}</code> <b>不存在</b>`);
    else if (env.socket_exists === true) diag.push(`容器内 <code>${esc(env.socket||'/var/run/docker.sock')}</code> 存在`);
    if (env.socket_found && env.socket_found.length) diag.push('但发现其它 socket：' + env.socket_found.map(esc).join('、'));
    noteHtml = `<div class="hint" style="margin-top:12px;color:var(--err)">一键更新暂不可用：${esc(env.reason || '未知原因')}</div>
      ${diag.length ? `<div class="hint" style="margin-top:6px">诊断：${diag.join('；')}</div>` : ''}
      <div class="hint" style="margin-top:10px">确认 <code>docker-compose.yml</code> 的 <code>volumes:</code> 里有这一行：</div>
      <pre class="logbox" style="margin-top:6px;padding:10px;font-size:12px;overflow:auto">      - /var/run/docker.sock:/var/run/docker.sock</pre>
      <div class="hint" style="margin-top:8px">⚠️ <b>改完必须重建容器才生效</b>：飞牛界面在 Compose 项目右侧点「三个点 → 重构」，
        或 SSH 执行 <code>docker compose up -d --force-recreate</code>。只点「启动」不会重新挂载。</div>
      <div class="hint" style="margin-top:8px">⚠️ 挂载 docker.sock 相当于把宿主机 Docker 的控制权交给这个容器，请自行评估。</div>
      <div class="hint" style="margin-top:8px">不想挂也行，手动更新：<code>docker compose pull &amp;&amp; docker compose up -d --force-recreate</code></div>`;
  }
  else if (hasNew){
    noteHtml = `<div class="hint" style="margin-top:12px">点击「立即更新」后会拉取新镜像并重建容器。期间页面会短暂断线（约 20~60 秒），
      账号与任务数据都在挂载卷里，不会丢失。</div>`;
  }

  box.innerHTML = `
    <div class="row">
      <div class="field" style="max-width:200px"><label>当前版本</label>
        <input type="text" value="v${esc(cur)}" readonly style="background:var(--panel-2)"></div>
      <div class="field" style="max-width:200px"><label>最新版本</label>
        <input type="text" value="${esc(latestTxt)}" readonly style="background:var(--panel-2)"></div>
    </div>
    <div style="margin:2px 0 12px">${statusHtml}</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
      <button class="btn" onclick="loadUpdateCard()">重新检查</button>
      <button class="btn" onclick="showUpdateLog()">上次更新日志</button>
      ${hasNew && env.supported ? `<button class="btn primary" onclick="applyUpdate()">立即更新到 v${esc(chk.latest)}</button>` : ''}
    </div>
    ${noteHtml}`;
}

async function applyUpdate(){
  if (!confirm('确定立即更新？\n\n容器会重启，页面将短暂断线（约 20~60 秒）。\n账号、任务、历史等数据都在挂载卷里，不会丢失。')) return;
  const box = $('#st-upd');
  const btn = event && event.target; if (btn) btn.disabled = true;
  try {
    const r = await api('/api/update/apply', { method:'POST', body:{} });
    box.innerHTML = `<div style="line-height:1.9">${esc(r.data.message)}</div>
      <div class="hint" style="margin-top:10px" id="upd-wait">正在等待服务恢复…</div>`;
    waitServerBack();
  } catch(e){ toast(e.message, 'err'); if (btn) btn.disabled = false; }
}

function waitServerBack(){
  let n = 0;
  const t = setInterval(async () => {
    n++;
    const el = $('#upd-wait');
    if (el) el.textContent = `正在等待服务恢复… 已等待 ${n * 3} 秒`;
    if (n > 80){ clearInterval(t); toast('等待超时，请手动刷新页面','err'); return; }
    try {
      const r = await api('/api/version');
      clearInterval(t);
      toast('更新完成，当前版本 v' + ((r.data || {}).version || '?'), 'ok');
      setTimeout(() => VIEWS.settings(), 900);
    } catch(e){ /* 服务还没起来，继续等 */ }
  }, 3000);
}

async function showUpdateLog(){
  try {
    const r = await api('/api/update/log');
    const log = (r.data || {}).log || '（暂无更新日志。用「立即更新」跑过一次之后才会有内容。）';
    modal('上次更新日志',
      `<div class="logbox" style="max-height:400px;white-space:pre-wrap;font-size:12px">${esc(log)}</div>`,
      `<button class="btn" onclick="clearUpdateLog()">清空</button><button class="btn" data-close>关闭</button>`);
  } catch(e){ toast(e.message, 'err'); }
}

async function clearUpdateLog(){
  try { await api('/api/update/log/clear', { method:'POST', body:{} }); toast('已清空','ok'); }
  catch(e){ toast(e.message, 'err'); }
}
async function settingsSave(){
  try{
    await api('/api/config/update',{method:'POST',body:{
      cron:{default_schedule:$('#st-cron').value.split('\n').map(s=>s.trim()).filter(Boolean)},
      quota_alert:{enabled:$('#st-qa-en').checked, threshold_percent:Number($('#st-qa-p').value||90), check_schedule:$('#st-qa-c').value.trim()},
      offline:{auto_trigger_qms:$('#st-of-en').checked, watch_schedule:$('#st-of-c').value.trim()},
      task:{auto_run_on_save:$('#st-autorun').checked},
    }});
    toast('已保存并重载定时计划','ok');
  }catch(e){ toast(e.message,'err'); }
}
async function changePwd(){
  try{ await api('/api/auth/password',{method:'POST',body:{old_password:$('#st-op').value, new_password:$('#st-np').value}});
    toast('密码已修改','ok'); $('#st-op').value=''; $('#st-np').value='';
  }catch(e){ toast(e.message,'err'); }
}

/* ============================================================
   启动
   ============================================================ */
let APP_VERSION = '';
(async function init(){
  // 版本号（不需要登录，更新镜像后用它核对是否生效）
  api('/api/version').then(r => {
    APP_VERSION = (r.data || {}).version || '';
    const el = $('#foot-version');
    if (el) el.textContent = 'v' + APP_VERSION;
  }).catch(()=>{});

  try{
    const r = await api('/api/auth/check');
    if (r.data && r.data.logged_in){ showApp(); $('#foot-user').textContent = 'admin'; switchView('dashboard'); }
    else showLogin();
  }catch(e){ showLogin(); }
})();
</script>
